<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Zoho - KPI/Status Digest Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📋</text></svg>">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead-text">
        <span class="badge">Assessment prototype · not for production use</span>
        <h1>{% block heading %}Zoho - KPI/Status Digest Agent{% endblock %}</h1>
        {% block lede %}{% endblock %}
      </div>
      <div class="brand">
        {% if logo_url %}
          <img src="{{ logo_url }}" alt="{{ org_name or 'Organisation' }} logo">
        {% elif org_name %}
          <span class="wordmark">{{ org_name }}</span>
        {% endif %}
      </div>
    </header>

    {% block content %}{% endblock %}
  </div>
</body>
</html>
