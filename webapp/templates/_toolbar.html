<div class="digestbar">
  <a class="digestbar-brand" href="{{ url_for('index') }}">Zoho - KPI/Status Digest Agent</a>
  <div class="digestbar-right">
    <a class="digestbar-btn" href="{{ url_for('index') }}">Run another</a>
    <form class="digestbar-form" method="post" action="{{ url_for('delete', run_id=run_id) }}"
          onsubmit="return confirm('Delete this run and its uploaded files?')">
      <button class="digestbar-btn danger" type="submit">Delete run</button>
    </form>
  </div>
</div>
<style>
  /* Reuses the brief's own design tokens (--surface, --rule, --ink, --critical…)
     so it inherits both themes automatically -- no palette of its own. */
  .digestbar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    padding:.55rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--rule);
  }
  .digestbar-brand{
    font-family:var(--mono);font-size:.74rem;font-weight:600;letter-spacing:.04em;
    color:var(--ink-2);text-decoration:none;
  }
  .digestbar-brand:hover{color:var(--ink)}
  .digestbar-right{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
  .digestbar-form{margin:0}
  .digestbar-btn{
    font-family:var(--body);font-size:.8rem;font-weight:600;line-height:1.2;
    padding:.4rem .8rem;border-radius:6px;border:1px solid var(--rule);
    background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer;
  }
  .digestbar-btn:hover{background:var(--surface-2)}
  .digestbar-btn.danger{color:var(--critical)}
  .digestbar-btn.danger:hover{
    background:color-mix(in srgb, var(--critical) 10%, transparent);
    border-color:var(--critical);
  }
  /* Pushes the report down clear of the fixed bar. Comes after the page's own
     body{background:...} rule, so it wins on padding-top without !important --
     different property, same specificity, later in the cascade. */
  body{padding-top:3.3rem}
  @media (max-width:30rem){ body{padding-top:4.7rem} }
</style>
